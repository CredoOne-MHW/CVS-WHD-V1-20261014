name: Build mobile app

# lms-workflow: 1.10.0
#
# That line is read by Super Admin › Mobile App Release › Check GitHub setup. The platform knows which
# revision it expects, so if this file in the repository is older than the platform, the panel says so by
# name instead of a build failing on something that was fixed releases ago. It only changes when this
# workflow or its scripts change.
#
# One company's app, one platform, one build.
#
# Super Admin › Company › Mobile App › Build dispatches this with everything the build needs. The finished,
# signed file is uploaded to that company's own S3 folder and the result is posted back to the platform,
# signed with MOBILE_BUILD_SECRET so nothing else can report a build.
#
# Signing keys live only here, in this repository's secrets. Android MUST keep the same keystore for every
# rebuild — a new key means the phone refuses the update and staff have to uninstall first.

on:
  workflow_dispatch:
    inputs:
      build_id: { description: "Platform build id", required: true }
      company_code: { description: "Company code, e.g. WHD", required: true }
      company_name: { description: "App name on the home screen", required: true }
      platform: { description: "android or ios", required: true, default: "android" }
      version: { description: "App version, e.g. 1.0.0.7", required: true }
      build_number: { description: "Build number for this company", required: true, default: "1" }
      bundle_id: { description: "Application id", required: true }
      primary: { description: "Brand colour", required: false, default: "#2f5c24" }
      accent: { description: "Accent colour", required: false, default: "#d9b52a" }
      api_base: { description: "The company's own address", required: true }
      s3_prefix: { description: "Where the finished file goes", required: true }
      callback_url: { description: "Where to report back", required: true }
      signing_url: { description: "Where to collect the platform's signing key (empty = use the repository secrets)", required: false, default: "" }
      target: { description: "test = .apk / ad-hoc .ipa to install directly; store = .aab / App Store .ipa for the stores", required: false, default: "test" }
      android_target_sdk: { description: "Android compile/target SDK level — Play refuses an app targeting a level more than about a year old", required: false, default: "35" }

concurrency:
  group: mobile-${{ inputs.company_code }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  build:
    # macos-15 carries Xcode 16. App Store Connect refuses a build made with an older Xcode, so macos-14
    # (Xcode 15) would be rejected at upload after a twenty-minute build.
    runs-on: ${{ inputs.platform == 'ios' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      # Everything this job needs from the repository, checked in the first second rather than discovered
      # after six minutes of compiling. A build that cannot report back or cannot upload has already failed;
      # it just does not know it yet.
      - name: Check this repository has what the build needs
        working-directory: .
        run: |
          MISSING=""
          [ -z "${{ secrets.MOBILE_BUILD_SECRET }}" ] && MISSING="$MISSING MOBILE_BUILD_SECRET"
          [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && MISSING="$MISSING AWS_ACCESS_KEY_ID"
          [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] && MISSING="$MISSING AWS_SECRET_ACCESS_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::This repository is missing:$MISSING — add them in Settings › Secrets and variables › Actions. The upload and the result callback both run here, on the runner, so they need this repository's own credentials. Super Admin › Mobile App Release › Set up secrets in GitHub can write them for you."
            exit 1
          fi
          echo "Repository secrets are present."

      - name: Tell the platform the build has started
        if: always()
        working-directory: .
        run: |
          node .github/scripts/report.mjs building 5 Waiting for a build machine
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          BUILD_ID: ${{ inputs.build_id }}
          MOBILE_BUILD_SECRET: ${{ secrets.MOBILE_BUILD_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Caching is an optimisation, so it must never be the thing that fails a build. setup-node errors
      # outright when cache-dependency-path matches nothing ("Some specified paths were not resolved"), so
      # the cache is switched on only when the lockfile is actually there.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('mobile/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: mobile/package-lock.json

      # npm ci is reproducible and needs the lockfile; npm install is the fallback when there isn't one.
      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            echo "::warning::mobile/package-lock.json is missing — installing without it, so this build may not match the last one."
            npm install
          fi

      - name: Progress · installed
        if: always()
        working-directory: .
        run: node .github/scripts/report.mjs building 20 Installing the app’s packages
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          BUILD_ID: ${{ inputs.build_id }}
          MOBILE_BUILD_SECRET: ${{ secrets.MOBILE_BUILD_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: The company's icon, if it has one
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          # the same address the finished file goes to, so the icon is looked for in the right bucket
          PREFIX="${{ inputs.s3_prefix }}"
          case "$PREFIX" in
            s3://*) REST="${PREFIX#s3://}"; ICON_BUCKET="${REST%%/*}" ;;
            *) ICON_BUCKET="${{ secrets.S3_BUCKET }}" ;;
          esac
          [ -n "$ICON_BUCKET" ] && aws s3 cp "s3://$ICON_BUCKET/${{ inputs.company_code }}/branding/app-icon.png" assets/company-icon.png || true

      - name: Brand this build
        run: node scripts/brand.mjs
        env:
          APP_NAME: ${{ inputs.company_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          PRIMARY: ${{ inputs.primary }}
          ACCENT: ${{ inputs.accent }}
          API_BASE: ${{ inputs.api_base }}
          COMPANY_CODE: ${{ inputs.company_code }}
          ANDROID_TARGET_SDK: ${{ inputs.android_target_sdk }}

      - name: Native project
        run: npx expo prebuild --platform ${{ inputs.platform }} --clean --no-install

      # ── Android ──────────────────────────────────────────────────────────
      - name: Progress · native project
        if: always()
        working-directory: .
        run: node .github/scripts/report.mjs building 40 Making the native project
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          BUILD_ID: ${{ inputs.build_id }}
          MOBILE_BUILD_SECRET: ${{ secrets.MOBILE_BUILD_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Java
        if: inputs.platform == 'android'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Signing key
        if: inputs.platform == 'android'
        run: |
          # The platform keeps one permanent key per company, so an update installs over the old app. It is
          # collected here rather than passed in as an input, because inputs are printed in this run's log.
          # Everything written below is masked, and the keystore is deleted when the build finishes.
          if [ -n "${{ inputs.signing_url }}" ]; then
            SIG=$(printf '%s' "${{ inputs.build_id }}" \
              | openssl dgst -sha256 -hmac "${{ secrets.MOBILE_BUILD_SECRET }}" -r | cut -d' ' -f1)
            if ! curl -fsS --retry 3 --retry-delay 2 \
                 -H "x-build-signature: sha256=$SIG" \
                 "${{ inputs.signing_url }}" -o /tmp/signing.json; then
              echo "::error::The platform did not hand over the signing key. Check MOBILE_BUILD_SECRET here and MOBILE_SIGNING_SECRET on the platform."
              exit 1
            fi
            ALIAS=$(jq -r .alias /tmp/signing.json)
            STORE_PW=$(jq -r .store_password /tmp/signing.json)
            KEY_PW=$(jq -r .key_password /tmp/signing.json)
            echo "::add-mask::$STORE_PW"; echo "::add-mask::$KEY_PW"
            jq -r .keystore_base64 /tmp/signing.json | base64 -d > android/app/release.jks
            rm -f /tmp/signing.json
            echo "Signed with the platform's key for this company (alias $ALIAS)."
          elif [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
            ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
            STORE_PW="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            KEY_PW="${{ secrets.ANDROID_KEY_PASSWORD }}"
            echo "Signed with this repository's own key."
          else
            echo "::error::No signing key. Set MOBILE_SIGNING_SECRET on the platform (it then makes and keeps one key per company), or add the four ANDROID_* secrets here. A build signed with a throw-away key cannot be updated over."
            exit 1
          fi
          {
            echo "MYAPP_UPLOAD_STORE_FILE=release.jks"
            echo "MYAPP_UPLOAD_KEY_ALIAS=$ALIAS"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$STORE_PW"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PW"
          } >> android/gradle.properties
          node ../.github/scripts/android-signing-config.mjs .

      # Google Play takes an Android App Bundle and makes the phone-ready files itself; an .apk is what you
      # hand to a phone directly. They are different artefacts, so the target decides which one is built.
      - name: Progress · compiling
        if: always()
        working-directory: .
        run: node .github/scripts/report.mjs building 55 Compiling and bundling
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          BUILD_ID: ${{ inputs.build_id }}
          MOBILE_BUILD_SECRET: ${{ secrets.MOBILE_BUILD_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Build the Android app
        if: inputs.platform == 'android'
        run: |
          cd android
          if [ "${{ inputs.target }}" = "store" ]; then
            ./gradlew bundleRelease --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      # ── iOS ──────────────────────────────────────────────────────────────
      - name: Certificates
        if: inputs.platform == 'ios'
        run: |
          if [ -z "${{ secrets.IOS_CERT_P12_BASE64 }}" ]; then
            echo "::error::IOS_CERT_P12_BASE64 is not set. Add the IOS_* secrets, then set MOBILE_IOS_SIGNING=1 on the platform."
            exit 1
          fi
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          echo "${{ secrets.IOS_CERT_P12_BASE64 }}" | base64 -d > cert.p12
          security import cert.p12 -k build.keychain -P "${{ secrets.IOS_CERT_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROFILE_BASE64 }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Build the IPA
        if: inputs.platform == 'ios'
        run: |
          cd ios && pod install
          xcodebuild -workspace *.xcworkspace -scheme "$(ls *.xcworkspace | sed 's/.xcworkspace//')" \
            -configuration Release -archivePath build/app.xcarchive archive \
            DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" CODE_SIGN_STYLE=Manual
          # app-store for App Store Connect, ad-hoc for the devices on the provisioning profile
          PLIST=../.github/ios-export.plist
          [ "${{ inputs.target }}" = "store" ] && PLIST=../.github/ios-export-store.plist
          xcodebuild -exportArchive -archivePath build/app.xcarchive -exportPath build/ipa \
            -exportOptionsPlist "$PLIST"

      # ── Upload and report ────────────────────────────────────────────────
      - name: Progress · built
        if: always()
        working-directory: .
        run: node .github/scripts/report.mjs building 85 Uploading the finished app
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          BUILD_ID: ${{ inputs.build_id }}
          MOBILE_BUILD_SECRET: ${{ secrets.MOBILE_BUILD_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Upload to the company's folder
        id: upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          set -e
          if [ "${{ inputs.platform }}" = "android" ] && [ "${{ inputs.target }}" = "store" ]; then
            SRC=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
            NAME="$(echo ${{ inputs.company_code }} | tr '[:upper:]' '[:lower:]')-android-${{ inputs.version }}.aab"
          elif [ "${{ inputs.platform }}" = "android" ]; then
            SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
            NAME="$(echo ${{ inputs.company_code }} | tr '[:upper:]' '[:lower:]')-android-${{ inputs.version }}.apk"
          else
            SRC=$(ls ios/build/ipa/*.ipa | head -1)
            NAME="$(echo ${{ inputs.company_code }} | tr '[:upper:]' '[:lower:]')-ios-${{ inputs.version }}.ipa"
          fi
          # The platform sends a full s3:// address when it knows its bucket (v1.8.13), so the bucket is not
          # configured twice. An older platform sends a bare prefix, and then the repository secret is used.
          PREFIX="${{ inputs.s3_prefix }}"
          case "$PREFIX" in
            s3://*)
              REST="${PREFIX#s3://}"
              BUCKET="${REST%%/*}"
              # with no path after the bucket, ${REST#*/} returns REST unchanged and would repeat the
              # bucket name inside the key
              if [ "$REST" = "$BUCKET" ]; then KEY="$NAME"; else KEY="${REST#*/}/$NAME"; fi
              ;;
            *)
              BUCKET="${{ secrets.S3_BUCKET }}"
              KEY="$PREFIX/$NAME"
              ;;
          esac
          if [ -z "$BUCKET" ]; then
            echo "::error::No S3 bucket. Set S3_BUCKET on the platform (it then sends it with every build), or add an S3_BUCKET secret to this repository. The app built fine — only the upload had nowhere to go."
            exit 1
          fi
          aws s3 cp "$SRC" "s3://$BUCKET/$KEY"
          echo "file_key=$KEY" >> $GITHUB_OUTPUT
          echo "file_name=$NAME" >> $GITHUB_OUTPUT
          echo "file_size=$(stat -f%z "$SRC" 2>/dev/null || stat -c%s "$SRC")" >> $GITHUB_OUTPUT
          echo "sha256=$(shasum -a 256 "$SRC" | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      # ── The stores ───────────────────────────────────────────────────────
      # Both uploads are optional and neither can fail the build: the artefact is already on S3 and can be
      # uploaded by hand, so a store that refuses costs a retry, not a rebuild.
      - name: Send to Google Play
        id: play
        if: inputs.platform == 'android' && inputs.target == 'store'
        continue-on-error: true
        env:
          PLAY_PACKAGE: ${{ inputs.bundle_id }}
          PLAY_SA_JSON: /tmp/play.json
          SA_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "note=kept on S3 — add GOOGLE_PLAY_SERVICE_ACCOUNT_JSON to upload automatically" >> $GITHUB_OUTPUT
            exit 0
          fi
          printf '%s' "$SA_JSON" > /tmp/play.json
          PLAY_AAB="$(ls android/app/build/outputs/bundle/release/*.aab | head -1)" \
            node ../.github/scripts/play-upload.mjs
          rm -f /tmp/play.json

      - name: Send to App Store Connect
        id: appstore
        if: inputs.platform == 'ios' && inputs.target == 'store'
        continue-on-error: true
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY_P8" ]; then
            echo "note=kept on S3 — add the three APP_STORE_CONNECT_* secrets to upload automatically" >> $GITHUB_OUTPUT
            exit 0
          fi
          # altool looks for the key in this exact place, under this exact name
          mkdir -p ~/private_keys
          printf '%s' "$KEY_P8" | base64 -d > ~/private_keys/AuthKey_$KEY_ID.p8
          IPA=$(ls ios/build/ipa/*.ipa | head -1)
          if xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"; then
            echo "note=uploaded — it appears in TestFlight once Apple has processed it" >> $GITHUB_OUTPUT
          else
            echo "::warning::App Store Connect refused the upload. The .ipa is on S3; check that the app exists in App Store Connect with this bundle id and that the build number has not been used before."
            echo "note=App Store Connect refused it — the .ipa is on S3" >> $GITHUB_OUTPUT
          fi
          rm -f ~/private_keys/*.p8

      - name: Tell the platform it is ready
        working-directory: .
        run: node .github/scripts/report.mjs ready
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          BUILD_ID: ${{ inputs.build_id }}
          MOBILE_BUILD_SECRET: ${{ secrets.MOBILE_BUILD_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FILE_KEY: ${{ steps.upload.outputs.file_key }}
          FILE_NAME: ${{ steps.upload.outputs.file_name }}
          FILE_SIZE: ${{ steps.upload.outputs.file_size }}
          SHA256: ${{ steps.upload.outputs.sha256 }}
          STORE_NOTE: ${{ steps.play.outputs.note || steps.appstore.outputs.note }}
          TARGET: ${{ inputs.target }}

      # the runner is thrown away, but a key is worth deleting the moment it is no longer needed
      - name: Shred the signing key
        if: always()
        run: rm -f android/app/release.jks /tmp/signing.json || true

      - name: Tell the platform it failed
        if: failure()
        working-directory: .
        run: node .github/scripts/report.mjs failed
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          BUILD_ID: ${{ inputs.build_id }}
          MOBILE_BUILD_SECRET: ${{ secrets.MOBILE_BUILD_SECRET }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ERROR: "The build failed — open the run on GitHub for the compiler's own message."
